<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Почтовый клиент (Лабораторная)</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 0 10px; }
        nav a { margin-right: 15px; text-decoration: none; color: #0056b3; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
        .actions a { margin-right: 10px; color: #d9534f; text-decoration: none; }
        .actions a.move { color: #5cb85c; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'inbox' %}">Входящие</a>
        <a href="{% url 'outbox' %}">Исходящие</a>
        <a href="{% url 'archive' %}">Архив</a>
        <a href="{% url 'trash' %}">Корзина</a>
        <a href="{% url 'compose' %}">Написать письмо</a>
    </nav>
    <hr>
    {% block content %}{% endblock %}
</body>
</html>
